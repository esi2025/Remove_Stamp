<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    
    <!-- Neon Stroke Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Stamp Red Ink Gradient -->
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Pen Blue Ink Gradient -->
    <linearGradient id="sig-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background Card with modern Windows squircle corner radius -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" />

  <!-- Grid patterns for visual scan tech look -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="24" x2="80" y2="488" />
    <line x1="160" y1="24" x2="160" y2="488" />
    <line x1="240" y1="24" x2="240" y2="488" />
    <line x1="320" y1="24" x2="320" y2="488" />
    <line x1="400" y1="24" x2="400" y2="488" />
    
    <line x1="24" y1="80" x2="488" y2="80" />
    <line x1="24" y1="160" x2="488" y2="160" />
    <line x1="24" y1="240" x2="488" y2="240" />
    <line x1="24" y1="320" x2="488" y2="320" />
    <line x1="24" y1="400" x2="488" y2="400" />
  </g>

  <!-- Inner glowing circle representing focal processing -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Holographic Scanner Scanline -->
  <line x1="40" y1="256" x2="472" y2="256" stroke="#818cf8" stroke-width="3" opacity="0.6" stroke-dasharray="12 4" />
  <polygon points="256,248 266,256 256,264 246,256" fill="#818cf8" opacity="0.8" />

  <!-- The Smart Stamp motif (Red Wax design) -->
  <g transform="translate(180, 190) scale(0.9)">
    <!-- Outer dashed/scallop ring of the stamp -->
    <circle cx="50" cy="50" r="85" fill="none" stroke="url(#stamp-grad)" stroke-width="8" stroke-dasharray="14 6" opacity="0.9" />
    <!-- Inner solid stamp border ring -->
    <circle cx="50" cy="50" r="65" fill="none" stroke="url(#stamp-grad)" stroke-width="6" opacity="0.9" />
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#stamp-grad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
    <!-- Central Persian/Arabic Emblem text mockup (Star emblem) -->
    <path d="M50,28 L55,42 L70,42 L58,51 L62,65 L50,56 L38,65 L42,51 L30,42 L45,42 Z" fill="url(#stamp-grad)" opacity="0.85" />
    <!-- "مهر رسمی" arched text lookalike notches -->
    <path d="M 5,50 A 45,45 0 0,1 95,50" fill="none" stroke="url(#stamp-grad)" stroke-dasharray="3 5" stroke-width="4" />
  </g>

  <!-- The Smart Signature motif (Blue digital pen stroke) overlaying the stamp -->
  <g transform="translate(100, 140)">
    <!-- Elegant simulated ink pen flow path -->
    <path d="M 20,240 C 60,200 120,60 180,110 C 240,160 140,280 200,220 C 260,160 320,100 370,120" 
          fill="none" stroke="url(#sig-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
          filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.25))" />
    
    <!-- Fine detail secondary signature swoops -->
    <path d="M 120,170 C 180,180 260,190 290,165" 
          fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Visual AI target brackets in corners -->
  <path d="M 70,110 L 70,70 L 110,70" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" />
  <path d="M 442,110 L 442,70 L 402,70" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" />
  <path d="M 70,402 L 70,442 L 110,442" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" />
  <path d="M 442,402 L 442,442 L 402,442" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" />
</svg>
